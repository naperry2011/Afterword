name: afterword
description: "A private, reflection-first reading journal with shareable recommendation cards."
publish_to: 'none'

# Build number bumps with every TestFlight upload.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Storage: embedded SQLite with versioned migrations (spec §5).
  drift: ^2.34.4
  drift_flutter: ^0.3.1

  # State and navigation.
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Open Library search and cover cache.
  http: ^1.6.0
  cached_network_image: ^4.0.0

  # Share card + JSON export/import.
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.6

flutter:
  uses-material-design: true

  # Both faces are bundled. No system font fallbacks in the UI (spec §2.2).
  # Variable fonts: one file covers every weight declared below.
  fonts:
    - family: Pixelify Sans
      fonts:
        - asset: assets/fonts/PixelifySans.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
